[global_config]
  suppress_multiple_term_dialog = True
  title_hide_sizetext = True
  broadcast_default = off
[keybindings]
[profiles]
  [[default]]
    use_system_font = False
    font = Monospace 10
    show_titlebar = True
    scrollback_lines = 20000
    background_color = "#101820"
    foreground_color = "#e9f0f5"
    background_darkness = 1.0
    cursor_color = "#ffffff"
    scrollbar_position = right
[layouts]
  [[lecture05]]
    [[[window0]]]
      type = Window
      parent = ""
      size = 1800, 950
    [[[rows]]]
      type = VPaned
      parent = window0
      ratio = 0.5
    [[[top]]]
      type = HPaned
      parent = rows
      ratio = 0.5
    [[[bringup]]]
      type = Terminal
      parent = top
      order = 0
      command = /home/jetson/ire_ws/lecture05-live/ui/pane.sh bringup
    [[[monitor]]]
      type = Terminal
      parent = top
      order = 1
      command = /home/jetson/ire_ws/lecture05-live/ui/pane.sh monitor
    [[[bottom]]]
      type = HPaned
      parent = rows
      ratio = 0.5
    [[[servo]]]
      type = Terminal
      parent = bottom
      order = 0
      command = /home/jetson/ire_ws/lecture05-live/ui/pane.sh servo
    [[[teleop]]]
      type = Terminal
      parent = bottom
      order = 1
      command = /home/jetson/ire_ws/lecture05-live/ui/pane.sh teleop
[plugins]
