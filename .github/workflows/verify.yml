name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-controller:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation and saved evidence
        run: python3 tools/check_repository.py
      - name: Test square patrol controller without ROS
        env:
          PYTHONPATH: mission1/mission1_202302200
        run: python3 -m unittest discover -s mission1/mission1_202302200/test -v
      - name: Install numerical dependency
        run: python3 -m pip install numpy==1.26.4
      - name: Test pick and place logic and recorded evidence without ROS
        run: |
          python3 mission4/submission/pick_demo_202302200.py
          python3 -m unittest discover -s mission4/tests -v
          cd mission4
          sha256sum -c SHA256SUMS
